[project]
authors = [{name = "Rohan B. Dalton", email = "rohan@rohandalton.io"}]
dependencies = [
    "redis>=5.0,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.0.0,<26",
    "opentelemetry-api>=1.20.0,<2",
]
name = "mithril-locks"
description = "Distributed locks with fencing tokens, sync and async APIs, and multiple backends"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">= 3.9"
dynamic = ["version"]
keywords = ["distributed-lock", "locking", "fencing", "redis", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Source = "https://github.com/RohanDalton/mithril"
Issues = "https://github.com/RohanDalton/mithril/issues"

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9,<3"]
async-postgres = ["asyncpg>=0.29,<1"]
async-sqlite = ["aiosqlite>=0.20,<1"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[tool.hatch.version]
path = "mithril/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["mithril"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["/mithril", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
core-metadata-version = "2.4"

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.report]
exclude_lines = [
    "if __name__ == __main__:",
]

[tool.coverage.run]
branch = true
data_file = "coverage/.coverage"
relative_files = true
source = ["mithril"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]
conda-pypi-map = { conda-forge = "conda_pypi_map.json" }

[tool.pixi.pypi-dependencies]
mithril-locks = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
mypy = "*"
ruff = "*"
pytest-asyncio = "*"
pytest-sugar = ">=1.1.1,<2"

[tool.pixi.feature.build.dependencies]
python = ">=3.9"
hatch = "*"
python-build = ">=1.2,<2"
twine = ">=6,<7"
hatchling = ">=1.27,<2"

[tool.pixi.feature.docs.dependencies]
sphinx = "*"

[tool.pixi.dependencies]
redis-py = ">=7.1.1,<8"
sqlalchemy = ">=2,<3"
structlog = ">=25.5.0,<26"
opentelemetry-api = ">=1.39.1,<2"
psycopg2 = ">=2.9.11,<3"
asyncpg = ">=0.31.0,<0.32"
aiosqlite = ">=0.22.1,<0.23"

[tool.pixi.environments.dev]
features = ["dev", "docs"]

[tool.pixi.environments.build]
features = ["build"]
no-default-feature = true

[tool.pixi.environments.dev.dependencies]
pre-commit = ">=4.6.2,<5"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=mithril --cov-branch --cov-report=term-missing --cov-report=html:coverage"

[tool.ruff]
line-length = 95
indent-width = 4
target-version = "py39"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["B", "C4", "FURB", "I", "PERF", "PL", "S", "SIM", "UP"]

[tool.ruff.lint.isort]
case-sensitive = true
